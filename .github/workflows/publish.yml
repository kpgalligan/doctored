# Builds, signs (Developer ID), notarizes and publishes Doctored.dmg as a
# GitHub Release on every push to the `publish` branch.
#
# The archive is the Distribution configuration: Release plus the Sparkle
# updater (designs/sparkle-updates.md). Beside the DMG goes a one-item
# appcast.xml, its EdDSA signature made over the stapled DMG
# (scripts/appcast.py); every installed copy reads it from
# releases/latest/download/appcast.xml.
#
# The archive's "Build Agent Helper" phase compiles the assistant's helper and
# its Slaude dependency with SwiftPM (scripts/build_agent_helper.sh,
# designs/assistant-helper.md), fetching Slaude at its pinned revision. Release
# compiles it file by file in batches, not as one whole module (which peaks at
# 10.6 GB): on a 96 GB Mac at three jobs that took 160 s, 435 s of CPU and a
# 2.1 GB peak. Its time and peak memory on this runner are not yet measured
# (#25, linked from designs/assistant-helper.md's Open section); the levers are
# DR_AGENT_BUILD_CONFIG=debug and a larger runner.
#
# Version: "<VERSION file>.<run number>", build number = run number. The run
# counter belongs to this file — renaming or recreating it restarts numbering,
# so leave the name alone: the build number is what installed copies compare,
# so restarting it stops updates (a forced recreation must add an offset to
# BUILD_NUMBER). A re-run keeps its run number, replaces the release's DMG and
# appcast rather than failing, and leaves Latest alone; Latest is always the
# highest run, so a run that creates a release older than the current Latest
# creates it with --latest=false.
#
# Secrets (in the `publish` environment, restricted to the `publish` branch):
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD  the exported Developer
#     ID Application certificate (.p12, base64-encoded) and its password
#   KEYCHAIN_PASSWORD  any random string; it locks the job's temporary keychain
#   APPLE_TEAM_ID  the Apple Developer team the archive is signed for
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64  an App Store Connect API key
#     (its key ID, issuer ID and base64-encoded .p8), used to notarize
#   SPARKLE_ED_PRIVATE_KEY  the owner's EdDSA private key, `generate_keys -x`
#     output; the first step fails without it, and the step after checkout when
#     its public half is not Distribution's DR_SPARKLE_PUBLIC_KEY
# Local builds are ad-hoc signed and need none of these.
name: Publish

on:
  push:
    branches: [publish]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    environment: publish
    timeout-minutes: 120
    steps:
      # Nothing ships without the update key (designs/sparkle-updates.md): the run stops
      # here, before anything is built or signed.
      - name: Check the update key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if ! [ -n "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::The publish environment has no SPARKLE_ED_PRIVATE_KEY secret"
            exit 1
          fi

      - uses: actions/checkout@v4

      # The secret's public half must be Distribution's DR_SPARKLE_PUBLIC_KEY before anything
      # is built (appcast.py check-key prints only public keys); the sign step checks it again
      # against the exported app.
      - name: Match the update key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: python3 scripts/appcast.py check-key

      - name: Compute paths and version
        run: |
          # The runner context isn't available in job-level env, so the paths
          # under RUNNER_TEMP are exported here for the later steps.
          {
            echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db"
            echo "ARCHIVE=$RUNNER_TEMP/Doctored.xcarchive"
            echo "EXPORT=$RUNNER_TEMP/export"
            echo "DMG=$RUNNER_TEMP/Doctored.dmg"
            echo "APPCAST=$RUNNER_TEMP/appcast.xml"
            echo "ED_KEY=$RUNNER_TEMP/sparkle_ed_key"
          } >> "$GITHUB_ENV"
          BASE="$(tr -d '[:space:]' < VERSION)"
          # macOS versions are at most three integers; the run number is the third.
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be MAJOR.MINOR, got '$BASE'"
            exit 1
          fi
          echo "VERSION=$BASE.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          xcodebuild -version
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          brew install xcodegen

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          P12="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put the signing keychain in the search list so xcodebuild and codesign find it.
          # The existing entries are split on purpose; runner keychain paths have no spaces.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$P12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          make project
          # Distribution is the configuration that ships: Release plus the updater.
          xcodebuild archive \
            -project Doctored.xcodeproj -scheme Doctored -configuration Distribution \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -archivePath "$ARCHIVE" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "$EXPORT"
          APP="$EXPORT/Doctored.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|Runtime)'
          plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist"
          plutil -extract CFBundleVersion raw "$APP/Contents/Info.plist"
          # The updater's published rows: Sparkle and its helpers signed by the team, the
          # helpers with the runtime, the feed, the decided key, the updater class, the seal,
          # the licence, the versions and the one Sparkle load command.
          python3 scripts/updater_check.py published --app "$APP" --version "$VERSION" --build "$BUILD_NUMBER"

      - name: Build DMG
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R "$EXPORT/Doctored.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          # hdiutil's own estimate from -srcfolder can come out short ("No space left on
          # device"), so the size is the staged folder's plus a quarter and 64 MB.
          SIZE_MB=$(( $(du -sm "$STAGE" | cut -f1) * 5 / 4 + 64 ))
          hdiutil create -volname Doctored -srcfolder "$STAGE" -size "${SIZE_MB}m" -ov -format UDZO "$DMG"
          codesign --sign "Developer ID Application" --timestamp --keychain "$KEYCHAIN" "$DMG"

      - name: Notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY"
          AUTH=(--key "$KEY" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")
          OUT="$(xcrun notarytool submit "$DMG" "${AUTH[@]}" --wait --timeout 1h --output-format json)"
          echo "$OUT"
          ID="$(jq -r .id <<< "$OUT")"
          STATUS="$(jq -r .status <<< "$OUT")"
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${AUTH[@]}" || true
            echo "::error::Notarization finished with status '$STATUS'"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      # The EdDSA signature is made over the stapled DMG, the bytes the release serves.
      # sign_update is the Sparkle package's own, from the archive's package resolution; the
      # key reaches it only as a 0600 file, removed straight after (and by the clean-up step).
      # appcast.py refuses a key whose public half is not the app's SUPublicEDKey.
      - name: Sign the update and write the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          COUNT="$(find build/SourcePackages/artifacts -path '*/bin/sign_update' -type f | wc -l | tr -d ' ')"
          if [ "$COUNT" != 1 ]; then
            echo "::error::Expected one sign_update under build/SourcePackages/artifacts, found $COUNT"
            exit 1
          fi
          SIGN_UPDATE="$(find build/SourcePackages/artifacts -path '*/bin/sign_update' -type f)"
          umask 077; printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$ED_KEY"
          python3 scripts/appcast.py write \
            --app "$EXPORT/Doctored.app" \
            --dmg "$DMG" \
            --sign-update "$SIGN_UPDATE" \
            --key-file "$ED_KEY" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/Doctored.dmg" \
            --notes-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            --out "$APPCAST"
          rm -f "$ED_KEY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run: both assets replaced, Latest left alone.
            gh release upload "$TAG" "$DMG" "$APPCAST" --clobber
          else
            # Every installed copy reads releases/latest/download/appcast.xml, so Latest is
            # always the highest run number: a release older than the current Latest is not made Latest.
            LATEST="$(gh release view --json tagName -q .tagName 2>/dev/null || true)"
            MAKE_LATEST="--latest"
            if [ -n "$LATEST" ] && [ "${LATEST##*.}" -gt "$GITHUB_RUN_NUMBER" ] 2> /dev/null; then
              MAKE_LATEST="--latest=false"
            fi
            gh release create "$TAG" "$DMG" "$APPCAST" \
              --target "$GITHUB_SHA" \
              --title "Doctored $VERSION" \
              --generate-notes \
              "$MAKE_LATEST"
          fi

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$ED_KEY"
